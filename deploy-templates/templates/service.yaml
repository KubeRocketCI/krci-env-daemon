apiVersion: v1
kind: Service
metadata:
  name: {{ include "krci-env-daemon.fullname" . }}
  labels:
    {{- include "krci-env-daemon.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 8081
      targetPort: metrics
      protocol: TCP
    - name: grpc-keda
      port: 9090
      targetPort: grpc-keda
      protocol: TCP
    - name: grpc-otlp
      port: 4317
      targetPort: grpc-otlp
      protocol: TCP
      appProtocol: grpc
  selector:
    {{- include "krci-env-daemon.selectorLabels" . | nindent 4 }}
