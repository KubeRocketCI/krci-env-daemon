{{- $fullname := include "krci-env-daemon.fullname" . }}
{{- $scopes := list "" }}
{{- if not .Values.watchAllNamespaces }}
{{- $scopes = splitList "," (include "krci-env-daemon.watchNamespaces" .) }}
{{- end }}
{{- range $scopes }}
{{- $kind := ternary "ClusterRole" "Role" (eq . "") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $kind }}
metadata:
  name: {{ $fullname }}-read
  {{- with . }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "krci-env-daemon.labels" $ | nindent 4 }}
rules:
  {{- include "krci-env-daemon.readRules" $ | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $kind }}Binding
metadata:
  name: {{ $fullname }}-read
  {{- with . }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "krci-env-daemon.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ $kind }}
  name: {{ $fullname }}-read
subjects:
  - kind: ServiceAccount
    name: {{ include "krci-env-daemon.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-leases
  labels:
    {{- include "krci-env-daemon.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["list", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-leases
  labels:
    {{- include "krci-env-daemon.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-leases
subjects:
  - kind: ServiceAccount
    name: {{ include "krci-env-daemon.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
