{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "krci-env-daemon.fullname" . }}
  labels:
    {{- include "krci-env-daemon.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "krci-env-daemon.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
